services:
  database:
    image: postgres:14.23-trixie
    container_name: golfnvibestest_db
    env_file:
      - ./Backend/.env
    ports:
      - "5432:5432"
    volumes:
      - golfnvibes_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - database
    volumes:
      - ./Backend:/app

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - /app/node_modules

volumes:
  golfnvibes_db_data: