services:
  database:
    image: postgres:14.23-trixie
    container_name: golfnvibes_db
    env_file:
      - ./Backend/.env
    volumes:
      - golfnvibes_db_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./Backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - database
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: golfnvibes_pgadmin
    env_file:
      - ./secrets/pgadmin.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - database
    restart: always

volumes:
  golfnvibes_db_data: